<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>Kate Kness</title>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Open+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  /* Kate Kness email template for Kit. Brand: warm paper, navy, telephone pink, sticker accents. */
  body { margin:0; padding:0; background:#fbf6ee; -webkit-text-size-adjust:100%; }
  table { border-collapse:collapse; }
  img { border:0; display:block; max-width:100%; height:auto; }
  .kk-body { font-family:'Open Sans', Helvetica, Arial, sans-serif; font-size:16px; line-height:1.65; color:#4f5577; }
  .kk-body h1, .kk-body h2, .kk-body h3 { font-family:'Gloock', Georgia, 'Times New Roman', serif; font-weight:400; color:#1f2c5f; margin:0 0 14px; line-height:1.1; }
  .kk-body h1 { font-size:36px; }
  .kk-body h2 { font-size:27px; margin-top:30px; }
  .kk-body h3 { font-size:21px; margin-top:24px; }
  .kk-body p { margin:0 0 16px; }
  .kk-body a { color:#c2456f; font-weight:700; }
  .kk-body strong { color:#1f2c5f; }
  .kk-body ul, .kk-body ol { margin:0 0 18px; padding-left:22px; }
  .kk-body li { margin:0 0 6px; }
  .kk-body hr { border:0; border-top:2px dotted #e8b9c9; margin:28px 0; }
  /* Quotes become a soft pink callout: perfect for "Your body has opinions. So do you." */
  .kk-body blockquote { margin:26px 0; padding:22px 24px; background:#fde6ee; border-radius:18px; border:0; color:#1f2c5f; font-family:'Playfair Display', Georgia, serif; font-style:italic; font-size:20px; line-height:1.4; }
  .kk-body blockquote p { margin:0; }
  /* Buttons from Kit's editor, plus a class for HTML blocks */
  .kk-body .kk-btn, .kk-body a.button, .kk-body .btn a { display:inline-block; background:#1f2c5f; color:#ffffff !important; text-decoration:none; font-family:'Open Sans', Helvetica, Arial, sans-serif; font-size:13px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:14px 26px; border-radius:44px; }
  .kk-body .kk-btn.pink { background:#ea5f95; }
  .kk-body .kk-btn.line { background:#ffffff; color:#1f2c5f !important; border:2px solid #1f2c5f; padding:12px 24px; }
  .kk-foot a { color:#1f2c5f; font-weight:700; text-decoration:none; }
  .kk-preheader { display:none !important; visibility:hidden; opacity:0; color:transparent; height:0; width:0; overflow:hidden; mso-hide:all; }
  @media (max-width:620px) {
    .kk-card { border-radius:0 !important; }
    .kk-pad { padding-left:24px !important; padding-right:24px !important; }
    .kk-body h1 { font-size:30px; }
  }
</style>
</head>
<body>
<span class="kk-preheader">Notes from Kate Kness. Book news, body notes, and where to find me next.</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fbf6ee;">
  <tr>
    <td align="center" style="padding:28px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;">
        <!-- Header: wordmark + the three connected dots -->
        <tr>
          <td align="center" style="padding:6px 0 22px;">
            <a href="https://katekness.com" style="text-decoration:none;font-family:'Gloock',Georgia,'Times New Roman',serif;font-size:30px;color:#1f2c5f;">Kate Kness</a>
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:10px auto 0;">
              <tr>
                <td style="width:10px;height:10px;border-radius:5px;background:#b09c79;font-size:0;line-height:0;">&nbsp;</td>
                <td style="width:26px;border-bottom:2px dotted #d9c7a6;font-size:0;line-height:0;">&nbsp;</td>
                <td style="width:10px;height:10px;border-radius:5px;background:#ea5f95;font-size:0;line-height:0;">&nbsp;</td>
                <td style="width:26px;border-bottom:2px dotted #d9c7a6;font-size:0;line-height:0;">&nbsp;</td>
                <td style="width:10px;height:10px;border-radius:5px;background:#6f8ea8;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Card -->
        <tr>
          <td class="kk-card" style="background:#fffdf9;border:1px solid #ece3d6;border-radius:26px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td class="kk-pad kk-body" style="padding:40px 44px 34px;font-family:'Open Sans',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.65;color:#4f5577;">
                  {{ message_content }}
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td align="center" class="kk-foot" style="padding:26px 20px 8px;font-family:'Open Sans',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#4f5577;">
            <img src="https://hello.katekness.com/email/clam.png" width="72" alt="" style="margin:0 auto 12px;">
            <a href="https://hello.katekness.com/book/">Girl, Listen</a> &nbsp;·&nbsp;
            <a href="https://www.instagram.com/katekness">Instagram</a> &nbsp;·&nbsp;
            <a href="https://katekness.com">katekness.com</a>
            <p style="margin:14px 0 0;color:#7a7f99;font-size:12px;">You're getting this because you joined my list or we met at an event.<br>
            <a href="{{ unsubscribe_url }}" style="color:#7a7f99;font-weight:400;text-decoration:underline;">Unsubscribe</a> anytime, no hard feelings.</p>
            <p style="margin:10px 0 0;color:#a0a3b8;font-size:11px;">{{ address }}</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
